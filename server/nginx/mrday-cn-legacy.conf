# 镜像的老名字 mrday.one.shuerzuo.cn：只剩一个 301 到现名（$mrday_cn_host）。
#
# 老名字把 mrday.one 整个嵌在最前面，Chrome 会拦一页「您是想访问 mrday.one 吧?」，所以它不能再
# 当入口用；但 ICP 备案材料、已经发出去的链接可能还写着它，留一条永久跳转，别让它变成死链。
# 证书是签过的那张；哪天它到期不续、文件没了，install-nginx.sh 就不装这份（否则整份配置校验失败）。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mrday.one.shuerzuo.cn;

    ssl_certificate /etc/letsencrypt/live/mrday.one.shuerzuo.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrday.one.shuerzuo.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://$mrday_cn_host$request_uri;
}
