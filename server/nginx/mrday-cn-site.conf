# 中国区备案镜像（ICP 备案 + 公安备案都在 shuerzuo.cn 这个主域名上）。**这是模板**：
# install-nginx.sh 把 __CN_HOST__ 换成此刻真有证书的那个名字再装（新名字 mrday.shuerzuo.cn 有证书
# 就用它，否则退回老名字 mrday.one.shuerzuo.cn），同时生成 conf.d/mrday-cn-host.conf 里的
# $mrday_cn_host，两处永远一致。改名过渡期里不管哪天 deploy，镜像都不会指向一个还没上线的名字。
#
# 内容和 mrday.one 一个字节都不差：同一个目录、同一份 snippets/mrday-site-body.conf。
# 只有两处不同：① 这里从不分流（它就是分流的终点，否则就是死循环）；② 网页版 IDE（/app/）
# 不在这个域名上跑——它的会话 cookie 钉在 .mrday.one，这个域名接不住，进去就是被弹回登录页。
# 所以 /app/ 原样送回 mrday.one，而 mrday.one 那边的分流刻意不碰 /app/，两边不会互相踢。
#
# 域名为什么要改：老名字把 mrday.one 整个嵌在最前面，Chrome 会拦成仿冒 mrday.one 的钓鱼站
# （见 install-nginx.sh 里的说明）。老名字在新名字上线后只剩 301（mrday-cn-legacy.conf）。
#
# 证书：/etc/letsencrypt/live/__CN_HOST__，由 setup-cn-mirror.sh 用 webroot 方式签（80 口的 ACME 入口
# 在 sites-enabled/mrday-site 里）。哪个名字都没有证书时这份文件不会被装。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __CN_HOST__;

    ssl_certificate /etc/letsencrypt/live/__CN_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CN_HOST__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/mrday-site-body.conf;

    location ^~ /app/ {
        return 302 https://mrday.one$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/mrday-cn-site.access.log;
    error_log /var/log/nginx/mrday-cn-site.error.log;
}
