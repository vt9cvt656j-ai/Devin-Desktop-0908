# 官网两个域名共用的站点主体（装到 /etc/nginx/snippets/mrday-site-body.conf）：
# mrday.one（美国官网）和 mrday.one.shuerzuo.cn（中国区备案镜像）从同一个目录出同一份文件，
# 头、缓存策略、资源路径全部一样——「镜像」的意思就是一个字节都不差。两个 server 各自只写
# 自己不一样的那两条 location（/ 和 /app/），其余都在这里。

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# index.html names the hashed bundle, so a browser holding an old copy keeps loading
# old assets — every deploy silently missed anyone who had visited before, and the
# only workaround was telling people to hard-reload. "no-cache" still allows the
# ETag revalidation below, so this costs one 304 per visit, not a re-download.
add_header Cache-Control "no-cache" always;
# ?region=intl 那一次种 cookie（值来自 conf.d/mrday-geo.conf，平时是空串、不发头）。
add_header Set-Cookie $mrday_set_region_cookie always;

# Deliberately no CSP, matching the tenant-site config: this page is built and
# published by hand and pulls in whatever the current build references. A CSP written
# here would be guessing at that and would break the site on the next rebuild, which
# is worse than not having one on a page that takes no input and holds no session.

# Dotfiles are not served — a build that happens to carry a .env or a .git directory
# would otherwise be publicly readable. .well-known stays open for renewals.
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
}

root /var/www/michael-sites/_hosts/www;
index index.html;

# The build content-hashes every asset filename, so a given URL's bytes never change:
# these can be cached hard and forever, which is what keeps "no-cache" on the HTML
# cheap — the page revalidates, the megabytes do not.
#
# The security headers are repeated because nginx does not merge `add_header`: a
# location that sets any header replaces the whole inherited set, so omitting them
# here would quietly drop HSTS and the rest for every script, stylesheet and image.
location ^~ /assets/ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 这一条**不能带 always**。always 会让 404 也顶着「缓存一年、immutable」出去，而 mrday.one 前面
    # 是 Cloudflare：一次请求撞上还没落盘的 bundle（并发部署那一瞬），边缘就把这个 404 缓存一年，
    # 文件随后补上了也没用——整站白屏到缓存过期。2026-09-07 实打实发生过一次。
    # 不带 always 时 add_header 只作用于 2xx / 3xx；404 交给下面那个具名 location，明确写 no-store——
    # Cloudflare 对没有缓存头的 404 也会按自己的默认 TTL 缓存几分钟，不能靠「没写头」。
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @asset_missing;
}
location @asset_missing {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "no-store" always;
    return 404;
}

# 把分流用到的事实原样交给页面：站点脚本在「IP 判成大陆、库里却没有省份」时拿它配合系统语言
# 再判一次（见 ide/website/src/lib/region.ts）。也是排查「为什么我被跳/没被跳」的直接读数。
# 同样要把头重复一遍（add_header 不合并）。
location = /__geo {
    default_type application/json;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "no-store" always;
    return 200 '{"country":"$mrday_country","region":"$mrday_region","strict":$mrday_cn_strict,"mirror":"$mrday_cn_host"}';
}
