# 官网按访客所在地分流 —— 这里只产出**事实**（在哪个国家、哪个省、要不要分流），
# 不做任何跳转。跳转本身写在 sites-enabled/mrday-site 的 `location /` 里，读的是这里的
# $mrday_cn_redirect。装到 /etc/nginx/conf.d/mrday-geo.conf（http 级，所有站点都看得见）。
#
# 为什么分流：产品是美国的，官网在 mrday.one；中国大陆里福建、江苏、浙江这几个省对未备案的境外
# 站点管得最严，这些访客给他们备案过的镜像域名 mrday.one.shuerzuo.cn（同一份站点内容，同一台
# 机器）。其余地区——包括大陆的其它省——一律留在美国官网：不受限的用户不该被换到镜像上去。
#
# 数据只有一个来源：本机的 DB-IP City Lite（免费、无需账号、CC BY 4.0），geoip-update.sh 每月
# 拉一次到 /etc/nginx/geoip/。auto_reload：文件换新后一小时内自动生效，不用 reload nginx。
# 查不到 → 国家记成 XX，不分流。库文件不存在时 install-nginx.sh 会改装 mrday-geo-off.conf
# （同名变量、恒不分流），站点配置照常通过校验。
#
# 为什么**不**信 Cloudflare 的 CF-IPCountry / cf-region-code：它们只是请求头，谁都能带。realip
# 模块只保护 CF-Connecting-IP（只在连接真来自 Cloudflare 网段时才认），对别的头一视同仁；而这台
# nginx 是 1.18，没有 $realip_remote_addr，事后分不清连接是不是从 Cloudflare 来的。实测直连源站
# 伪造这两个头就能把自己跳到镜像——影响不大，但一条判断链里不该有可以从外面写的输入。
#
# 只认 $remote_addr：Cloudflare 的真实 IP 已经由 conf.d/cloudflare-realip.conf 还原进去了，
# 直连镜像域名的请求 $remote_addr 本来就是访客自己。

# 分流跳转的目标 $mrday_cn_host 不在这里：它是 install-nginx.sh 按「哪个名字此刻有证书」生成到
# conf.d/mrday-cn-host.conf 的（新名字 mrday.shuerzuo.cn 优先，退回老名字）。名字本身只在
# install-nginx.sh 顶上那两个变量里定义。

geoip2 /etc/nginx/geoip/dbip-city-lite.mmdb {
    auto_reload 1h;
    $mrday_country default=XX source=$remote_addr country iso_code;
    $mrday_region  source=$remote_addr subdivisions 0 names en;
}

# 严管地区名单 —— **只在这一处改**。左边是「国家:省」，省认英文名（实测库里就是 "Fujian" /
# "Jiangsu" / "Zhejiang"）；两字母省码留着，换成带 ISO 码的库时照样能用。不锚定结尾：
# 有的库写成 "Zhejiang Sheng"。
# 客户端那份名单（ide/website/src/lib/region.ts 的 STRICT_REGIONS）由测试对账，改这里要一起改。
map "$mrday_country:$mrday_region" $mrday_cn_strict {
    default 0;
    "~*^CN:(Fujian|Jiangsu|Zhejiang|FJ|JS|ZJ|CN-FJ|CN-JS|CN-ZJ)" 1;
}

# 访客明确选过国际站就不再分流：镜像站页脚的「访问国际站」带 ?region=intl 过来，mrday.one
# 顺手种一年 cookie（下面那个 Set-Cookie 值），之后每次直接放行。
map $cookie_mrday_region $mrday_stay_cookie {
    default 0;
    intl    1;
    us      1;
}
# ?region= 三个取值：intl / us = 我要国际站；cn = 把我当严管地区访客（**测试开关**：人在美国
# 也能亲眼看一遍分流链，只影响带这个参数的那一次请求）。别的值一律当没写。
map $arg_region $mrday_arg {
    default "";
    intl    intl;
    us      intl;
    cn      cn;
}

# 最终裁决：严管地区 且 没选过国际站（cookie 与参数都没有）→ 1；?region=cn 无条件 1。
map "$mrday_cn_strict:$mrday_stay_cookie:$mrday_arg" $mrday_cn_redirect {
    default  0;
    "1:0:"   1;
    "~:cn$"  1;
}

# ?region=intl 那一次给 mrday.one 种 cookie；平时这个值是空串，nginx 对空值的 add_header 不发头。
map $mrday_arg $mrday_set_region_cookie {
    default "";
    intl    "mrday_region=intl; Domain=mrday.one; Path=/; Max-Age=31536000; Secure; SameSite=Lax";
}
