# mrday-geo.conf 的替身：本机没有地理库（geoip-update.sh 还没跑成）时 install-nginx.sh 装这份。
# 变量一个不少、名字一样，只是按 IP 的那一半恒为「不分流」——站点配置里引用它们的地方照样通过
# nginx -t，官网照常服务，所有访客都留在 mrday.one。?region=cn 的测试开关照样有效（镜像本身
# 不依赖地理库）。拉到库以后再跑一次 install-nginx.sh 就换回真的。
map $host $mrday_country { default XX; }
map $host $mrday_region { default ""; }
map $host $mrday_cn_strict { default 0; }
map $cookie_mrday_region $mrday_stay_cookie {
    default 0;
    intl    1;
    us      1;
}
map $arg_region $mrday_arg {
    default "";
    intl    intl;
    us      intl;
    cn      cn;
}
map $mrday_arg $mrday_cn_redirect {
    default 0;
    cn      1;
}
map $mrday_arg $mrday_set_region_cookie {
    default "";
    intl    "mrday_region=intl; Domain=mrday.one; Path=/; Max-Age=31536000; Secure; SameSite=Lax";
}
