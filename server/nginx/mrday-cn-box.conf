# 国内那台机器（阿里云，备案接入的主机）上的镜像站点 —— **模板**，deploy-cn-box.sh 把 __CN_HOST__
# 换成镜像域名再装到那台机器的 /etc/nginx/sites-enabled/mrday-cn-box。
#
# 和美国站的区别只有三处：① 证书自己签（webroot，80 口留 ACME 入口）；② 没有地理库——分流的判断
# 只在美国站做，这里只需要 snippets/mrday-site-body.conf 引用的那几个变量存在（conf.d 里装的是
# mrday-geo-off.conf 的替身 + 生成的 mrday-cn-host.conf）；③ /app/（网页版 IDE）送回 mrday.one，
# 理由和美国站上的镜像一样：会话 cookie 钉在 .mrday.one。
# 不 include certbot 的 options-ssl-nginx.conf：那个文件只有装了 certbot 的 nginx 插件才有，
# 这里用 webroot 方式签，TLS 参数直接写。
server {
    listen 80;
    listen [::]:80;
    server_name __CN_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://__CN_HOST__$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __CN_HOST__;

    ssl_certificate /etc/letsencrypt/live/__CN_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CN_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mrday_cn:10m;
    ssl_session_timeout 1d;

    include snippets/mrday-site-body.conf;

    location ^~ /app/ {
        return 302 https://mrday.one$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/mrday-cn-box.access.log;
    error_log /var/log/nginx/mrday-cn-box.error.log;
}
